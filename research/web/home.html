      <p>Build an agent that answers a clinic's back-office requests using its web records system.</p>
      <p><a href="https://practice.speedrun.scopehealth.com/">Explore the practice clinic</a>.</p>
      <p>Register with <a href="/signup/google/">Google</a>, <a href="/signup/github/">GitHub</a>, or <a href="/#register">email</a>.</p>
